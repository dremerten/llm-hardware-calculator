---
apiVersion: v1
kind: Namespace
metadata:
  name: calc-prod
  labels:
    name: calc-prod

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: calc
  namespace: calc-prod
  labels:
    app: calc
    environment: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: calc
      environment: production
  template:
    metadata:
      labels:
        app: calc
        environment: production
    spec:
      containers:
      - name: calc
        image: ${IMAGE_NAME}:${CALC_IMAGE_TAG}
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: APP_VERSION
          value: ${CALC_IMAGE_TAG}
        resources:
          requests:
            memory: "24Mi"
            cpu: "15m"
          limits:
            memory: "96Mi"
            cpu: "150m"
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: calc
  namespace: calc-prod
  labels:
    app: calc
    environment: production
spec:
  type: ClusterIP
  selector:
    app: calc
    environment: production
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: calc
  namespace: calc-prod
spec:
  parentRefs:
  - name: global-gateway
    namespace: nginx-gateway
    sectionName: calc-prod
  hostnames:
  - calc.dremer10.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: calc
      port: 80

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: calc-http-redirect
  namespace: calc-prod
spec:
  parentRefs:
  - name: global-gateway
    namespace: nginx-gateway
    sectionName: acme-http
  hostnames:
  - calc.dremer10.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
