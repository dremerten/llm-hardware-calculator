---
apiVersion: v1
kind: Namespace
metadata:
  name: calc-staging
  labels:
    name: calc-staging

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: calc
  namespace: calc-staging
  labels:
    app: calc
    environment: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: calc
      environment: staging
  template:
    metadata:
      labels:
        app: calc
        environment: staging
    spec:
      containers:
      - name: calc
        image: ${IMAGE_NAME}:${CALC_IMAGE_TAG}
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: APP_VERSION
          value: ${CALC_IMAGE_TAG}
        resources:
          requests:
            memory: "16Mi"
            cpu: "10m"
          limits:
            memory: "64Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: calc
  namespace: calc-staging
  labels:
    app: calc
    environment: staging
spec:
  type: ClusterIP
  selector:
    app: calc
    environment: staging
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: calc
  namespace: calc-staging
spec:
  parentRefs:
  - name: global-gateway
    namespace: nginx-gateway
    sectionName: calc-staging
  hostnames:
  - calc-staging.dremer10.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: calc
      port: 80
